    <style>
      :root {
        --bg: #111111;
        --accent: #E4FF1A;
        --text-main: #FFFFFF;
        --text-muted: #A1A1A1;
        --glass: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.08);
        --accent-glow: rgba(228, 255, 26, 0.6);
        --paper-opacity: 0;
        --line-opacity: 0.6;
      }

      .light-mode {
        --bg: #FAF9F6; 
        --accent: #1A1A1A; 
        --text-main: #121212;
        --text-muted: #444444;
        --glass: rgba(255, 255, 255, 0.4);
        --glass-border: rgba(0, 0, 0, 0.1);
        --accent-glow: rgba(0, 0, 0, 0.15); 
        --paper-opacity: 0.01;
        --line-opacity: 0.25;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg);
        color: var(--text-main);
        overflow-x: hidden;
        transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }

      /* Paper Grain - Subtle for body background only */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: var(--paper-opacity);
        mix-blend-mode: multiply;
      }

      .glass-panel {
        background-color: var(--glass);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        transition: transform 0.3s ease, background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      }
      
      .glass-modal {
        background-color: var(--bg);
        backdrop-filter: blur(40px) saturate(180%);
        -webkit-backdrop-filter: blur(40px) saturate(180%);
        border: 1px solid var(--glass-border);
        box-shadow: 0 8px 32px 0 var(--accent-glow);
      }

      .hover-glow:hover {
        box-shadow: 0 0 35px var(--accent-glow);
        border-color: var(--accent);
      }
      
      /* New diverse fonts */
      .font-monoton { font-family: 'Monoton', cursive; }
      .font-megrim { font-family: 'Megrim', cursive; }
      .font-dotgothic { font-family: 'DotGothic16', sans-serif; }
      .font-pressstart { font-family: 'Press Start 2P', cursive; }
      .font-rye { font-family: 'Rye', cursive; }
      .font-zilla { font-family: 'Zilla Slab Highlight', cursive; }
      
      .font-cinzel { font-family: 'Cinzel', serif; }
      .font-playfair { font-family: 'Playfair Display', serif; }
      .font-mono { font-family: 'Space Mono', monospace; }
      .font-abril { font-family: 'Abril Fatface', cursive; }
      .font-bebas { font-family: 'Bebas Neue', sans-serif; }
      .font-bodoni { font-family: 'Bodoni Moda', serif; }
      .font-dancing { font-family: 'Dancing Script', cursive; }
      .font-syne { font-family: 'Syne', sans-serif; }
      .font-montserrat { font-family: 'Montserrat', sans-serif; }
      .font-unifraktur { font-family: 'UnifrakturMaguntia', cursive; }
      .font-special { font-family: 'Special Elite', cursive; }
      .font-cormorant { font-family: 'Cormorant Garamond', serif; }
      .font-almendra { font-family: 'Almendra Display', cursive; }
      .font-marcellus { font-family: 'Marcellus', serif; }
      .font-italiana { font-family: 'Italiana', serif; }
      .font-tenor { font-family: 'Tenor Sans', sans-serif; }
      .font-libre { font-family: 'Libre Baskerville', serif; }

      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: var(--bg); }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
      
      /* Optimization for animations */
      .will-change-transform { will-change: transform; }
